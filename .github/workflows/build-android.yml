name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install npm deps
        run: npm install

      - name: Always regenerate Android project
        run: |
          rm -rf android
          npx cap add android
          echo "=== android/ after cap add ==="
          ls -la android/
          echo "=== root gradle files ==="
          ls -la android/build.gradle* 2>/dev/null || echo "no root gradle"
          ls -la android/app/build.gradle* 2>/dev/null || echo "no app gradle"

      - name: Verify Gradle files exist
        run: |
          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "FATAL: no root gradle file after cap add"
            ls -la android/
            exit 1
          fi
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "FATAL: no app gradle file after cap add"
            ls -la android/app/
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Gradle permissions
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendario-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
